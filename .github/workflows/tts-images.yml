name: tts-images
on:
  workflow_dispatch:
  push:
    paths: ["tts/**", ".github/workflows/tts-images.yml"]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [qwen3, cosyvoice]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tts/${{ matrix.name }}
          push: true
          # Same (already public) package as the audio worker, distinct tags.
          tags: ghcr.io/samalencar/acestep-runpod:tts-${{ matrix.name }},ghcr.io/samalencar/acestep-runpod:tts-${{ matrix.name }}-${{ github.sha }}
