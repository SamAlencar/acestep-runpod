name: acestep-runpod-image
on:
  workflow_dispatch:
  push:
    paths: ["Dockerfile", "handler.py", "convert_official.py", "requirements.txt", ".github/workflows/acestep-runpod-image.yml"]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tags=ghcr.io/${owner}/acestep-runpod:latest,ghcr.io/${owner}/acestep-runpod:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make GHCR package public (needed so RunPod can pull without a registry credential)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/acestep-runpod/visibility" \
            -f visibility=public || true
          # Also try the repo-linked path used by some GHCR accounts.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/users/${owner}/packages/container/acestep-runpod/visibility" \
            -f visibility=public || true
